[tox]
isolated_build=true
envlist=
    py31{0,1,2,3,4}
    mypy
    black
    flake8

[default]
sources = src

[testenv]
wheel = True
parallel_show_output = True
passenv = *
deps =
    coverage
commands =
    python -V
    python -m coverage run -p -m unittest discover -s src -v {posargs:}

[testenv:mypy]
use_develop = true
deps =
    mypy
commands =
    mypy src

[testenv:black]
deps =
    black
commands =
    black --check src

[testenv:flake8]
deps =
    flake8
commands =
    flake8 src

[flake8]
ignore = E203, W503, E704, E501
